name: Blog Quiz Videos

on:
  push:
    branches: ['codex/render-selected-campaigns']
  workflow_run:
    workflows: ['Daily Blog Autopilot']
    types: [completed]
    branches: [master]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/blog-quiz-videos.yml'
      - 'scripts/*quiz*'
      - 'scripts/*blog-video*'
      - 'scripts/*voice*'
      - 'scripts/*social-policy*'
      - 'scripts/export-blog-video-sources.mjs'
      - 'scripts/video-requirements.txt'
      - 'config/blog-video-state-seed.json'
      - 'config/quiz-social-policy.json'

permissions:
  contents: read

concurrency:
  group: blog-quiz-videos-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/video-requirements.txt
      - run: python -m pip install -r scripts/video-requirements.txt
      - name: Check parsing, title selection, answer reveals and duplicate protection
        run: |
          python scripts/test-quiz-video.py
          python scripts/test-blog-video-watcher.py
          python scripts/test-cloud-blog-videos.py
          python scripts/test-quiz-social-policy.py
          python scripts/test-blog-video-campaign.py
      - uses: actions/cache@v4
        with:
          path: .social-automation/voices
          key: kokoro-english-fp16-v1-1
      - run: python scripts/download-kokoro-voice.py
      - name: Render a real narrated sample on Linux
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: >-
          python scripts/create-quiz-video.py
          --slug university-of-sindh-entry-test-mcqs
          --count 5 --max-duration 89
          --voice-engine kokoro
          --kokoro-model .social-automation/voices/kokoro/kokoro-v1.0.fp16.onnx
          --kokoro-voices .social-automation/voices/kokoro/voices-v1.0.bin
          --output .social-automation/cloud-smoke
      - name: Save the cloud voice and video sample
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-quiz-smoke
          path: |
            .social-automation/cloud-smoke/mcqsbase-quiz.mp4
            .social-automation/cloud-smoke/preview.png
            .social-automation/cloud-smoke/reveal-preview.png
            .social-automation/cloud-smoke/manifest.json
            .social-automation/cloud-smoke/platform-captions.json
          retention-days: 3

  campaign-plan:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      generate: ${{ steps.plan.outputs.generate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Check campaign slot before installing video tools
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/plan-blog-video-campaign.py

  create-new-videos:
    if: needs.campaign-plan.outputs.generate == 'true'
    needs: campaign-plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      deployments: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/video-requirements.txt
      - run: python -m pip install -r scripts/video-requirements.txt
      - uses: actions/cache@v4
        with:
          path: .social-automation/voices
          key: kokoro-english-fp16-v1-1
      - run: python scripts/download-kokoro-voice.py
      - name: Create videos for Metricool
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cloud-blog-videos.py
      - name: Save completed video packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-quiz-videos-${{ github.run_id }}
          path: |
            .social-automation/blog-videos/videos/*/mcqsbase-quiz.mp4
            .social-automation/blog-videos/videos/*/preview.png
            .social-automation/blog-videos/videos/*/reveal-preview.png
            .social-automation/blog-videos/videos/*/manifest.json
            .social-automation/blog-videos/videos/*/caption.txt
            .social-automation/blog-videos/videos/*/first-comment.txt
            .social-automation/blog-videos/videos/*/platform-captions.json
            .social-automation/blog-videos/videos/*/campaign.json
          retention-days: 35
          if-no-files-found: ignore
