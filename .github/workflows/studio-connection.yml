name: Studio Connection Check
on:
  push:
    branches: ['codex/five-video-blog-batches', 'codex/activate-daily-quiz-batches', 'codex/quiz-batch-launch-proof']
    paths: ['scripts/probe-studio-cloud.py', '.github/workflows/studio-connection.yml']
  workflow_dispatch:
    inputs:
      reconcile_launch_receipt:
        description: 'Metadata only: link the existing Facebook Part 3 after its source-comment repair (never republish)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read four channel identities and posting schemas without creating posts
        env:
          MCQS_STUDIO_API_KEY: ${{ secrets.MCQS_STUDIO_API_KEY }}
          RECONCILE_LAUNCH_RECEIPT: ${{ inputs.reconcile_launch_receipt == true && 'true' || 'false' }}
        run: python scripts/probe-studio-cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: studio-connection
          path: .social-automation/studio-connection.json
          retention-days: 3
