name: Daily Blog Autopilot

on:
  schedule:
    # 09:15 Asia/Karachi
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Publish date override, for example 2026-10-04'
        required: false
        type: string
      category:
        description: 'Optional category override, for example English'
        required: false
        type: string
      auto_merge:
        description: 'Merge the generated PR automatically'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate daily static blog
        env:
          BLOG_DATE: ${{ inputs.date }}
          BLOG_CATEGORY: ${{ inputs.category }}
          MCQSBASE_SOURCE_URL: https://www.mcqsbase.com
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
        run: npm run generate:daily-blog

      - name: Build check
        run: npm run build

      - name: Create and merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No daily blog changes to publish."
            exit 0
          fi

          DATE_VALUE="${{ inputs.date }}"
          if [ -z "$DATE_VALUE" ]; then
            DATE_VALUE="$(date -u +%F)"
          fi

          BRANCH="automation/daily-blog-${DATE_VALUE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/blog src/data/importedBlogArticles.js
          git commit -m "Add daily MCQ blog for ${DATE_VALUE}"
          git push --force-with-lease --set-upstream origin "$BRANCH"

          PR_NUMBER="$(gh pr list \
            --head "$BRANCH" \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$PR_NUMBER" ]; then
            if ! PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
              -f base="master" \
              -f head="$BRANCH" \
              -f title="Daily MCQ blog - ${DATE_VALUE}" \
              -f body="Adds the static daily MCQ blog article, registers it for the blog index, and makes it available through the generated sitemap." 2>pr-create-error.log)"; then
              cat pr-create-error.log
              echo "::error::Could not create a pull request. In GitHub, check Settings > Actions > General > Workflow permissions and enable 'Allow GitHub Actions to create and approve pull requests'."
              exit 1
            fi

            PR_NUMBER="$(echo "$PR_JSON" | jq -r '.number')"
          fi

          if [ "$AUTO_MERGE" != "false" ]; then
            gh pr merge "$PR_NUMBER" --squash --delete-branch
          fi
