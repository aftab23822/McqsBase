name: Daily Blog Autopilot

on:
  schedule:
    # 05:00 Asia/Karachi (UTC+05:00). GitHub cron uses UTC.
    # Publication follows generation/build checks; scheduled starts can be delayed.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Publish date override, for example 2026-10-04'
        required: false
        type: string
      category:
        description: 'Optional category override, for example English'
        required: false
        type: string
      auto_merge:
        description: 'Publish automatically after automated checks pass'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-blog-autopilot-production
  cancel-in-progress: false

jobs:
  daily-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve the Pakistan publication date
        id: publication-date
        env:
          BLOG_DATE: ${{ inputs.date }}
        run: node --input-type=module -e "import {isoDate} from './scripts/generate-daily-blog.mjs'; import fs from 'node:fs'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'date=' + isoDate() + '\n');"

      - name: Restore a previously validated draft for this date
        id: draft-cache
        uses: actions/cache/restore@v4
        with:
          path: .social-automation/daily-blog-drafts/${{ steps.publication-date.outputs.date }}.json
          key: daily-blog-draft-v1-${{ steps.publication-date.outputs.date }}

      - name: Install dependencies
        run: npm ci

      - name: Check published content and generator regressions
        run: node --test scripts/blog-quality.test.mjs scripts/published-blogs.test.mjs scripts/generate-daily-blog.test.mjs

      - name: Generate daily static blog
        id: generate
        env:
          BLOG_DATE: ${{ steps.publication-date.outputs.date }}
          BLOG_CATEGORY: ${{ inputs.category }}
          MCQSBASE_SOURCE_URL: https://www.mcqsbase.com
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
        run: npm run generate:daily-blog

      - name: Keep the validated draft before building or merging
        if: steps.draft-cache.outputs.cache-hit != 'true' && steps.generate.outcome == 'success' && hashFiles(format('.social-automation/daily-blog-drafts/{0}.json', steps.publication-date.outputs.date)) != ''
        uses: actions/cache/save@v4
        with:
          path: .social-automation/daily-blog-drafts/${{ steps.publication-date.outputs.date }}.json
          key: daily-blog-draft-v1-${{ steps.publication-date.outputs.date }}

      - name: Build check
        run: npm run build

      - name: Create and merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_MERGE: ${{ github.event_name == 'schedule' || inputs.auto_merge }}
          DATE_VALUE: ${{ steps.publication-date.outputs.date }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No daily blog changes to publish."
            exit 0
          fi

          BRANCH="automation/daily-blog-${DATE_VALUE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/blog src/data/importedBlogArticles.js
          git commit -m "Add daily MCQ blog for ${DATE_VALUE}"
          git push --force-with-lease --set-upstream origin "$BRANCH"

          PR_NUMBER="$(gh pr list \
            --head "$BRANCH" \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$PR_NUMBER" ]; then
            if ! PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
              -f base="master" \
              -f head="$BRANCH" \
              -f title="Daily MCQ blog - ${DATE_VALUE}" \
              -f body="Adds the static daily MCQ blog article, registers it for the blog index, and makes it available through the generated sitemap." 2>pr-create-error.log)"; then
              cat pr-create-error.log
              echo "::error::Could not create a pull request. In GitHub, check Settings > Actions > General > Workflow permissions and enable 'Allow GitHub Actions to create and approve pull requests'."
              exit 1
            fi

            PR_NUMBER="$(echo "$PR_JSON" | jq -r '.number')"
          fi

          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge "$PR_NUMBER" --squash --delete-branch
          fi
