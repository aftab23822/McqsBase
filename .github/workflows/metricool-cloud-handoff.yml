name: Metricool Cloud Handoff

on:
  push:
    branches: ['codex/metricool-cloud-handoff']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/metricool-cloud-handoff.yml'
      - 'scripts/*metricool*'
      - 'scripts/quiz-cloud-media.py'
      - 'config/quiz-approved-launch.json'
  workflow_run:
    workflows: ['Blog Quiz Videos']
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: metricool-cloud-handoff
  cancel-in-progress: false

jobs:
  unit-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests==2.32.5
      - run: |
          python scripts/test-metricool-campaign-payload.py
          python scripts/test-metricool-cloud-publish.py
  connection-test:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[connection-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify cloud access without creating posts
        env:
          MCQS_MAKE_WEBHOOK_URL: ${{ secrets.MCQS_MAKE_WEBHOOK_URL }}
          MCQS_MAKE_API_KEY: ${{ secrets.MCQS_MAKE_API_KEY }}
        run: python scripts/probe-metricool-cloud.py

  draft-test:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[draft-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests==2.32.5 imageio-ffmpeg==0.6.0
      - name: Verify four video drafts through Make without publication
        env:
          GH_TOKEN: ${{ github.token }}
          MCQS_MAKE_WEBHOOK_URL: ${{ secrets.MCQS_MAKE_WEBHOOK_URL }}
          MCQS_MAKE_API_KEY: ${{ secrets.MCQS_MAKE_API_KEY }}
        run: python scripts/metricool-cloud-publish.py --draft-test

  publish-selected-campaigns:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Check selected campaign queue before installing media tools
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/plan-metricool-handoff.py
      - if: steps.plan.outputs.handoff == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.plan.outputs.handoff == 'true'
        run: python -m pip install requests==2.32.5 imageio-ffmpeg==0.6.0
      - name: Schedule only selected ready campaigns through Metricool
        if: steps.plan.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MCQS_MAKE_WEBHOOK_URL: ${{ secrets.MCQS_MAKE_WEBHOOK_URL }}
          MCQS_MAKE_API_KEY: ${{ secrets.MCQS_MAKE_API_KEY }}
        run: python scripts/metricool-cloud-publish.py
